services:

  frontend:
    build:
      context: ./frontend

    container_name: ai_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    depends_on:
      - backend

  backend:
    build:
      context: ./backend

    container_name: ai_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine

    container_name: ai_postgres

    environment:
      POSTGRES_DB: career_copilot_db
      POSTGRES_USER: himanshukumar
      POSTGRES_PASSWORD: himanshu123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: ai_redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: